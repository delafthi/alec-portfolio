[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.biome.config.biome]
experimental.rename = true

[language-server.biome.config.biome.inlineConfig]
linter.rules.suspicious.noConsole = "off"

[[language]]
name = "javascript"
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome"
]
auto-format = true

[[language]]
name = "typescript"
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "biome"
]
auto-format = true

[[language]]
name = "json"
language-servers = [
  { name = "vscode-json-language-server", except-features = ["format"] },
  "biome"
]
auto-format = true

[[language]]
name = "jsonc"
language-servers = [
  { name = "vscode-json-language-server", except-features = ["format"] },
  "biome"
]
auto-format = true

[[language]]
name = "css"
language-servers = ["biome"]
auto-format = true

[[language]]
name = "html"
language-servers = ["biome"]
auto-format = true

[[language]]
name = "astro"
language-servers = [
  { name = "astro-language-server", except-features = ["format"] },
  "biome"
]
auto-format = true
