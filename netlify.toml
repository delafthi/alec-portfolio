[build]
command = "pnpm run build"
publish = "dist"
# Automated dependency merges (flake/npm/dependabot) don't build on push;
# the weekly scheduled rebuild deploys them in one batch. Content commits
# still deploy instantly.
ignore = "bash scripts/netlify-ignore.sh"

# Canonical hostname: www redirects to apex. Needs force because the language
# rules below would otherwise serve the site on both hostnames.
[[redirects]]
from = "https://www.alecs.pictures/*"
to = "https://alecs.pictures/:splat"
status = 301
force = true

# Browser-language redirect for the root page. Astro's i18n fallback is a
# 2s meta-refresh page; this replaces it with an instant server redirect.
[[redirects]]
from = "/"
to = "/de/"
status = 302
force = true
conditions = { Language = ["de"] }

[[redirects]]
from = "/"
to = "/en/"
status = 302
force = true

# Fingerprinted build assets are safe to cache forever.
[[headers]]
for = "/_astro/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
